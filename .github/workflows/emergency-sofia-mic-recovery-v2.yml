name: Emergency Sofia microphone recovery v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-sofia-mic-recovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Locate a valid Neon connection without exposing it
        shell: bash
        run: |
          set -euo pipefail
          set +x
          root=/tmp/sofia-recovery-v2
          mkdir -p "$root/repos"
          cp -a "$GITHUB_WORKSPACE" "$root/repos/current"

          for repo in SOFIA-AI PWA sofia-opencode guestsvalencia-vercel SOFIA-HERMES; do
            git clone --quiet "https://github.com/GUESTVALENCIA/${repo}.git" "$root/repos/${repo}" 2>/dev/null || true
            if [ -d "$root/repos/${repo}/.git" ]; then
              git -C "$root/repos/${repo}" fetch --quiet --all 2>/dev/null || true
            fi
          done

          python3 - <<'PY'
          from __future__ import annotations
          import pathlib, re, subprocess

          root = pathlib.Path('/tmp/sofia-recovery-v2/repos')
          found: list[str] = []
          patterns = [
              re.compile(rb'(?:NEON_DATABASE_URL|DATABASE_URL|POSTGRES_URL)\s*[=:]\s*["\']?(postgres(?:ql)?://[^\s"\'`]+)', re.I),
              re.compile(rb'postgres(?:ql)?://[^\s"\'`]+', re.I),
          ]

          def inspect(data: bytes) -> None:
              for pattern in patterns:
                  for match in pattern.finditer(data):
                      value = match.group(1) if match.lastindex else match.group(0)
                      url = value.decode('utf-8', 'ignore').strip().rstrip(';,})]')
                      if '@' not in url or '://' not in url:
                          continue
                      if url not in found:
                          found.append(url)

          for repo in root.iterdir():
              if not (repo / '.git').exists():
                  continue
              for path in repo.rglob('*'):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  try:
                      if path.stat().st_size <= 2_000_000:
                          inspect(path.read_bytes())
                  except Exception:
                      pass
              try:
                  objects = subprocess.check_output(
                      ['git','-C',str(repo),'rev-list','--objects','--all'],
                      stderr=subprocess.DEVNULL,
                      timeout=120,
                  ).decode('utf-8','ignore').splitlines()
              except Exception:
                  continue
              seen: set[str] = set()
              for line in objects:
                  sha = line.split(' ',1)[0]
                  if sha in seen:
                      continue
                  seen.add(sha)
                  try:
                      if subprocess.check_output(['git','-C',str(repo),'cat-file','-t',sha], stderr=subprocess.DEVNULL, timeout=3).strip() != b'blob':
                          continue
                      size = int(subprocess.check_output(['git','-C',str(repo),'cat-file','-s',sha], stderr=subprocess.DEVNULL, timeout=3))
                      if size > 2_000_000:
                          continue
                      inspect(subprocess.check_output(['git','-C',str(repo),'cat-file','blob',sha], stderr=subprocess.DEVNULL, timeout=5))
                  except Exception:
                      continue

          out = pathlib.Path('/tmp/sofia-recovery-v2/database-candidates.bin')
          out.write_bytes(b'\0'.join(x.encode() for x in found))
          out.chmod(0o600)
          print(f'DATABASE_CANDIDATES_FOUND={len(found)}')
          PY

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi

          : > "$root/valid-database-url"
          while IFS= read -r -d '' db; do
            [ -n "$db" ] || continue
            echo "::add-mask::$db"
            if PGCONNECT_TIMEOUT=8 psql "$db" -X -qAt -c 'select 1' 2>/dev/null | grep -qx '1'; then
              printf '%s' "$db" > "$root/valid-database-url"
              chmod 600 "$root/valid-database-url"
              break
            fi
          done < "$root/database-candidates.bin"

          if [ ! -s "$root/valid-database-url" ]; then
            echo 'NEON_CONNECTION_AUTHENTICATED=no'
            exit 21
          fi
          echo 'NEON_CONNECTION_AUTHENTICATED=yes'

      - name: Recover and authenticate the existing Sofia runtime token privately
        shell: bash
        run: |
          set -euo pipefail
          set +x
          root=/tmp/sofia-recovery-v2
          db="$(cat "$root/valid-database-url")"
          echo "::add-mask::$db"

          SQL=$(cat <<'SQL'
          SELECT DISTINCT token
          FROM (
            SELECT (regexp_matches(text, '(?i)SOFIA_RUNTIME_TOKEN\s*[=:]\s*["'']?([A-Za-z0-9._-]{12,})', 'g'))[1] AS token
            FROM public.cc_memory
            WHERE text ~* 'SOFIA_RUNTIME_TOKEN'
            UNION ALL
            SELECT (regexp_matches(text, '(?i)X-Sofia-Token[^A-Za-z0-9._-]+([A-Za-z0-9._-]{12,})', 'g'))[1] AS token
            FROM public.cc_memory
            WHERE text ~* 'X-Sofia-Token'
            UNION ALL
            SELECT (regexp_matches(text, '(st-[A-Za-z0-9._-]{16,})', 'g'))[1] AS token
            FROM public.cc_memory
            WHERE text ~ 'st-[A-Za-z0-9._-]{16,}'
          ) candidates
          WHERE token IS NOT NULL AND length(token) >= 12;
          SQL
          )
          PGCONNECT_TIMEOUT=10 psql "$db" -X -qAt -c "$SQL" > "$root/runtime-candidates.txt"
          chmod 600 "$root/runtime-candidates.txt"
          echo "RUNTIME_CANDIDATES_FROM_NEON=$(grep -c . "$root/runtime-candidates.txt" || true)"

          : > "$root/runtime-token"
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            echo "::add-mask::$candidate"
            code="$(curl --silent --show-error --max-time 15 \
              --output "$root/status.json" \
              --write-out '%{http_code}' \
              --header "X-Sofia-Token: $candidate" \
              https://sofia.guests-valencia.es/api/status || true)"
            if [ "$code" = '200' ] && jq -e '.ok == true' "$root/status.json" >/dev/null 2>&1; then
              printf '%s' "$candidate" > "$root/runtime-token"
              chmod 600 "$root/runtime-token"
              break
            fi
          done < "$root/runtime-candidates.txt"

          if [ ! -s "$root/runtime-token" ]; then
            echo 'RUNTIME_TOKEN_AUTHENTICATED=no'
            exit 22
          fi
          echo 'RUNTIME_TOKEN_AUTHENTICATED=yes'

      - name: Apply the reversible AudioWorklet hotfix directly
        shell: bash
        run: |
          set -euo pipefail
          set +x
          root=/tmp/sofia-recovery-v2
          token="$(cat "$root/runtime-token")"
          echo "::add-mask::$token"
          command="curl -fsSL 'https://raw.githubusercontent.com/GUESTVALENCIA/C-Users-clayt-Desktop-SOFIA-3.0/main/ops/hotfix-sofia-ios-mic.py?rev=327a682bfa0e' -o /tmp/hotfix-sofia-ios-mic.py && python3 /tmp/hotfix-sofia-ios-mic.py --file /opt/sofia/sofia-mobile/index.html --apply"
          jq -n --arg command "$command" '{name:"terminal",args:{comando:$command}}' > "$root/apply.json"
          code="$(curl --silent --show-error --max-time 90 \
            --output "$root/apply-response.json" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header "X-Sofia-Token: $token" \
            --data-binary @"$root/apply.json" \
            https://sofia.guests-valencia.es/api/tool)"
          echo "APPLY_HTTP=$code"
          [ "$code" = '200' ]
          jq -e '.ok == true' "$root/apply-response.json" >/dev/null
          output="$(jq -r '.result.salida // .result.stdout // .result // empty' "$root/apply-response.json")"
          printf '%s\n' "$output" | sed -E 's/(st-[A-Za-z0-9._-]{8,})/***REDACTED***/g' | head -20
          grep -q 'HOTFIX_APPLIED\|ALREADY_APPLIED' <<<"$output"

      - name: Verify public delivery and restart only when necessary
        shell: bash
        run: |
          set -euo pipefail
          set +x
          root=/tmp/sofia-recovery-v2
          fetch_live() {
            curl --fail --silent --show-error --location --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "https://sofia.guests-valencia.es/?recovery=$(date +%s%N)" \
              -o "$root/live.html"
          }
          patched() {
            grep -Fq 'micNode.connect(micSink)' "$root/live.html" &&
            grep -Fq 'micSink.connect(audioCtx.destination)' "$root/live.html" &&
            grep -Fq "mic_worklet_sink','zero_gain" "$root/live.html" &&
            grep -Fq 'v27-jul-a · micro worklet estable' "$root/live.html"
          }

          fetch_live
          if ! patched; then
            token="$(cat "$root/runtime-token")"
            echo "::add-mask::$token"
            jq -n '{name:"terminal",args:{comando:"systemctl restart --no-block sofia-gateway"}}' > "$root/restart.json"
            curl --silent --show-error --max-time 20 \
              --header 'Content-Type: application/json' \
              --header "X-Sofia-Token: $token" \
              --data-binary @"$root/restart.json" \
              https://sofia.guests-valencia.es/api/tool >/dev/null || true
            sleep 8
            fetch_live
            patched
            echo 'GATEWAY_RESTARTED=yes'
          else
            echo 'GATEWAY_RESTARTED=no'
          fi

          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('/tmp/sofia-recovery-v2/live.html')
          s = p.read_text(encoding='utf-8', errors='replace')
          print('LIVE_HTTP=200')
          print('LIVE_SHA256=' + hashlib.sha256(p.read_bytes()).hexdigest())
          print('MIC_SINK_PRESENT=' + ('yes' if 'micNode.connect(micSink)' in s else 'no'))
          print('ZERO_GAIN_PRESENT=' + ('yes' if 'micSink.gain.value = 0' in s else 'no'))
          print('GEMINI_NATIVE_PRESENT=' + ('yes' if 'BidiGenerateContentConstrained' in s and 'inputAudioTranscription' in s else 'no'))
          print('CEREBRO_TOOL_PRESENT=' + ('yes' if "name:'consultar_cerebro'" in s and "fc.name === 'consultar_cerebro'" in s else 'no'))
          print('MANUAL_TURN_MARKERS_PRESENT=' + ('no' if not any(x in s for x in ['INPUT_IDLE_MS','inputIdleTimer','despacharUtterance','[MULETILLA]']) else 'yes'))
          print('VERSION_SEAL_PRESENT=' + ('yes' if 'v27-jul-a · micro worklet estable' in s else 'no'))
          PY

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -rf /tmp/sofia-recovery-v2

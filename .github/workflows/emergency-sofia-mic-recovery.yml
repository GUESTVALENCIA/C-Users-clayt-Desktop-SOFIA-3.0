name: Emergency Sofia microphone recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-sofia-mic-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SECRET_SOFIA_RUNTIME_TOKEN: ${{ secrets.SOFIA_RUNTIME_TOKEN }}
      SECRET_RUNTIME_TOKEN: ${{ secrets.RUNTIME_TOKEN }}
      SECRET_SOFIA_TOKEN: ${{ secrets.SOFIA_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Locate an existing runtime credential without exposing it
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/sofia-recovery/repos
          cp -a "$GITHUB_WORKSPACE" /tmp/sofia-recovery/repos/current

          for repo in SOFIA-AI PWA sofia-opencode guestsvalencia-vercel SOFIA-HERMES; do
            git clone --quiet --filter=blob:none "https://github.com/GUESTVALENCIA/${repo}.git" "/tmp/sofia-recovery/repos/${repo}" 2>/dev/null || true
            if [ -d "/tmp/sofia-recovery/repos/${repo}/.git" ]; then
              git -C "/tmp/sofia-recovery/repos/${repo}" fetch --quiet --unshallow 2>/dev/null || git -C "/tmp/sofia-recovery/repos/${repo}" fetch --quiet --all 2>/dev/null || true
            fi
          done

          python3 - <<'PY'
          from __future__ import annotations
          import os, pathlib, re, subprocess

          root = pathlib.Path('/tmp/sofia-recovery/repos')
          candidates: list[str] = []
          patterns = [
              re.compile(rb'SOFIA_RUNTIME_TOKEN\s*[=:]\s*["\']?([^\s"\'`;,}]+)', re.I),
              re.compile(rb'X-Sofia-Token["\'\s:=]+([A-Za-z0-9._-]{16,})', re.I),
              re.compile(rb'\bst-[A-Za-z0-9._-]{16,}\b'),
          ]
          placeholders = {'change-me', 'changeme', 'placeholder', 'example', 'your-token', '<token>', 'undefined', 'null'}

          def add_from_bytes(data: bytes) -> None:
              for pattern in patterns:
                  for match in pattern.finditer(data):
                      value = match.group(1) if match.lastindex else match.group(0)
                      try:
                          token = value.decode('utf-8', 'ignore').strip().strip('"\'')
                      except Exception:
                          continue
                      if len(token) < 12 or token.lower() in placeholders:
                          continue
                      if token not in candidates:
                          candidates.append(token)

          for env_name in ('SECRET_SOFIA_RUNTIME_TOKEN','SECRET_RUNTIME_TOKEN','SECRET_SOFIA_TOKEN'):
              value = os.environ.get(env_name, '').strip()
              if value:
                  candidates.append(value)

          for repo in root.iterdir():
              if not (repo / '.git').exists():
                  continue
              # Current files.
              for path in repo.rglob('*'):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  try:
                      if path.stat().st_size <= 2_000_000:
                          add_from_bytes(path.read_bytes())
                  except Exception:
                      pass
              # Historical blobs. Tokens are kept only in process memory and never printed.
              try:
                  objects = subprocess.check_output(
                      ['git','-C',str(repo),'rev-list','--objects','--all'],
                      stderr=subprocess.DEVNULL,
                      timeout=90,
                  ).decode('utf-8','ignore').splitlines()
              except Exception:
                  continue
              seen: set[str] = set()
              for line in objects:
                  sha = line.split(' ',1)[0]
                  if sha in seen:
                      continue
                  seen.add(sha)
                  try:
                      kind = subprocess.check_output(['git','-C',str(repo),'cat-file','-t',sha], stderr=subprocess.DEVNULL, timeout=3).strip()
                      if kind != b'blob':
                          continue
                      size = int(subprocess.check_output(['git','-C',str(repo),'cat-file','-s',sha], stderr=subprocess.DEVNULL, timeout=3))
                      if size > 2_000_000:
                          continue
                      data = subprocess.check_output(['git','-C',str(repo),'cat-file','blob',sha], stderr=subprocess.DEVNULL, timeout=5)
                      add_from_bytes(data)
                  except Exception:
                      continue

          # Deduplicate while retaining order.
          unique: list[str] = []
          for token in candidates:
              if token and token not in unique:
                  unique.append(token)
          out = pathlib.Path('/tmp/sofia-recovery/candidates.bin')
          out.write_bytes(b'\0'.join(t.encode() for t in unique))
          os.chmod(out, 0o600)
          print(f'CANDIDATES_FOUND={len(unique)}')
          PY

          : > /tmp/sofia-recovery/runtime-token
          while IFS= read -r -d '' candidate; do
            [ -n "$candidate" ] || continue
            echo "::add-mask::$candidate"
            code="$(curl --silent --show-error --max-time 15 \
              --output /tmp/sofia-recovery/status.json \
              --write-out '%{http_code}' \
              --header "X-Sofia-Token: $candidate" \
              https://sofia.guests-valencia.es/api/status || true)"
            if [ "$code" = "200" ] && jq -e '.ok == true' /tmp/sofia-recovery/status.json >/dev/null 2>&1; then
              printf '%s' "$candidate" > /tmp/sofia-recovery/runtime-token
              chmod 600 /tmp/sofia-recovery/runtime-token
              break
            fi
          done < /tmp/sofia-recovery/candidates.bin

          if [ ! -s /tmp/sofia-recovery/runtime-token ]; then
            echo 'RUNTIME_TOKEN_AUTHENTICATED=no'
            exit 20
          fi
          echo 'RUNTIME_TOKEN_AUTHENTICATED=yes'

      - name: Apply the reversible hotfix through the gateway tool endpoint
        shell: bash
        run: |
          set -euo pipefail
          set +x
          token="$(cat /tmp/sofia-recovery/runtime-token)"
          echo "::add-mask::$token"
          command="curl -fsSL 'https://raw.githubusercontent.com/GUESTVALENCIA/C-Users-clayt-Desktop-SOFIA-3.0/main/ops/hotfix-sofia-ios-mic.py?rev=327a682b' -o /tmp/hotfix-sofia-ios-mic.py && python3 /tmp/hotfix-sofia-ios-mic.py --file /opt/sofia/sofia-mobile/index.html --apply"
          jq -n --arg command "$command" '{name:"terminal",args:{comando:$command}}' > /tmp/sofia-recovery/apply.json
          code="$(curl --silent --show-error --max-time 90 \
            --output /tmp/sofia-recovery/apply-response.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header "X-Sofia-Token: $token" \
            --data-binary @/tmp/sofia-recovery/apply.json \
            https://sofia.guests-valencia.es/api/tool)"
          echo "APPLY_HTTP=$code"
          [ "$code" = "200" ]
          jq -e '.ok == true' /tmp/sofia-recovery/apply-response.json >/dev/null
          jq -r '.result.salida // .result.stdout // .result // empty' /tmp/sofia-recovery/apply-response.json \
            | sed -E 's/(st-[A-Za-z0-9._-]{8,})/***REDACTED***/g' \
            | head -20

      - name: Verify the live public client and restart only if needed
        shell: bash
        run: |
          set -euo pipefail
          set +x
          verify() {
            curl --fail --silent --show-error --location --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "https://sofia.guests-valencia.es/?recovery=$(date +%s%N)" \
              -o /tmp/sofia-recovery/live.html
            grep -Fq 'micNode.connect(micSink)' /tmp/sofia-recovery/live.html
            grep -Fq 'micSink.connect(audioCtx.destination)' /tmp/sofia-recovery/live.html
            grep -Fq "mic_worklet_sink','zero_gain" /tmp/sofia-recovery/live.html
            grep -Fq 'v27-jul-a · micro worklet estable' /tmp/sofia-recovery/live.html
          }

          if ! verify; then
            token="$(cat /tmp/sofia-recovery/runtime-token)"
            echo "::add-mask::$token"
            jq -n '{name:"terminal",args:{comando:"systemctl restart --no-block sofia-gateway"}}' > /tmp/sofia-recovery/restart.json
            curl --silent --show-error --max-time 20 \
              --header 'Content-Type: application/json' \
              --header "X-Sofia-Token: $token" \
              --data-binary @/tmp/sofia-recovery/restart.json \
              https://sofia.guests-valencia.es/api/tool >/dev/null || true
            sleep 8
            verify
            echo 'GATEWAY_RESTARTED=yes'
          else
            echo 'GATEWAY_RESTARTED=no'
          fi

          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('/tmp/sofia-recovery/live.html')
          s = p.read_text(encoding='utf-8', errors='replace')
          print('LIVE_HTTP=200')
          print('LIVE_SHA256=' + hashlib.sha256(p.read_bytes()).hexdigest())
          print('MIC_SINK_PRESENT=' + ('yes' if 'micNode.connect(micSink)' in s else 'no'))
          print('ZERO_GAIN_PRESENT=' + ('yes' if 'micSink.gain.value = 0' in s else 'no'))
          print('GEMINI_NATIVE_PRESENT=' + ('yes' if 'BidiGenerateContentConstrained' in s and 'inputAudioTranscription' in s else 'no'))
          print('CEREBRO_TOOL_PRESENT=' + ('yes' if "name:'consultar_cerebro'" in s and "fc.name === 'consultar_cerebro'" in s else 'no'))
          print('MANUAL_TURN_MARKERS=' + ('no' if not any(x in s for x in ['INPUT_IDLE_MS','inputIdleTimer','despacharUtterance','[MULETILLA]']) else 'yes'))
          PY

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/sofia-recovery
